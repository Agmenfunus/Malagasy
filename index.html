      ["Handeha", "ira (futur)", "han-dé-a"],

      ["Andeha", "allons-y, viens", "an-dé-a"],
      ["Androany", "aujourd'hui", "an-drou-a-ni"],
      ["Omaly", "hier", "ou-ma-li"],
      ["Rahampitso", "demain", "ra-ham-pit-sou"],
      ["Ankehitriny", "maintenant", "an-ké-i-tri-ni"],
      ["Maraina", "matin", "ma-raï-na"],
      ["Hariva", "soir", "ha-ri-va"],
      ["Alina", "nuit", "a-li-na"],
      ["Matory", "dormir", "ma-tou-ri"],
      ["Hahita anao", "à bientôt (je te verrai)", "ha-hi-ta a-naou"]
    ],
    tip: "Les verbes changent de première lettre selon le temps : m- pour le présent, n- pour le passé, h- pour le futur. Mandeha, nandeha, handeha. Mihinana, nihinana, hihinana. Mividy, nividy, hividy. Une fois repérée, cette règle s'applique à la grande majorité des verbes."
  },
  {
    id: "u11", t: "Les jours et le calendrier", mg: "Ny andro",
    intro: "Les sept jours, plus semaine, mois et année.",
    items: [
      ["Alatsinainy", "lundi", "a-la-tsi-naï-ni"],
      ["Talata", "mardi", "ta-la-ta"],
      ["Alarobia", "mercredi", "a-la-rou-bi-a"],
      ["Alakamisy", "jeudi", "a-la-ka-mi-si"],
      ["Zoma", "vendredi", "zou-ma"],
      ["Asabotsy", "samedi", "a-sa-bou-tsi"],
      ["Alahady", "dimanche", "a-la-ha-di"],
      ["Andro", "jour", "an-drou"],
      ["Herinandro", "semaine", "hé-ri-nan-drou"],
      ["Volana", "mois", "vou-la-na"],
      ["Taona", "année", "tou-a-na"]
    ],
    tip: "Alahady, le dimanche, est le jour de la famille et de l'église. C'est souvent le moment des grands repas et des retrouvailles, donc un jour où tu entendras beaucoup de malgache."
  }
];


(function () {
  var KEY = "dingana-malagasy-v1";
  var BOX_DAYS = [0, 0, 1, 3, 7, 14, 30];
  var app = document.getElementById("app");

  function today() { var d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  var S = { cards: {}, intro: {}, days: [], unlockAll: false };
  try { var raw = localStorage.getItem(KEY); if (raw) { var p = JSON.parse(raw); if (p && typeof p === "object") { S.cards = p.cards || {}; S.intro = p.intro || {}; S.days = p.days || []; S.unlockAll = !!p.unlockAll; } } } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function touchDay() { var t = today(); if (S.days.indexOf(t) < 0) { S.days.push(t); S.days = S.days.slice(-400); save(); } }
  function streak() { var t = today(), n = 0; var has = function (d) { return S.days.indexOf(d) >= 0; }; if (!has(t)) t -= 1; while (has(t)) { n++; t--; } return n; }

  var ALL = [];
  UNITS.forEach(function (u, ui) { u.items.forEach(function (it, i) { ALL.push({ id: u.id + ":" + i, u: ui, mg: it[0], fr: it[1], pr: it[2] }); }); });
  var BYID = {}; ALL.forEach(function (c) { BYID[c.id] = c; });

  function unitCards(ui) { return ALL.filter(function (c) { return c.u === ui; }); }
  function mastery(ui) { var cs = unitCards(ui); if (!S.intro[UNITS[ui].id]) return 0; var n = 0; cs.forEach(function (c) { var s = S.cards[c.id]; if (s && s.b >= 3) n++; }); return n / cs.length; }
  function isOpen(ui) { if (S.unlockAll || ui === 0) return true; return !!S.intro[UNITS[ui - 1].id] && mastery(ui - 1) >= 0.5; }
  function dueCards() { var t = today(); return ALL.filter(function (c) { var s = S.cards[c.id]; return s && s.d <= t; }); }
  function learnedCount() { return ALL.filter(function (c) { var s = S.cards[c.id]; return s && s.b >= 3; }).length; }
  function introduce(ui) { var id = UNITS[ui].id; if (S.intro[id]) return; S.intro[id] = true; unitCards(ui).forEach(function (c) { if (!S.cards[c.id]) S.cards[c.id] = { b: 1, d: today() }; }); save(); }
  function grade(id, level) { // 0 encore, 1 bien, 2 facile
    var s = S.cards[id] || { b: 1, d: today() };
    if (level === 0) s.b = 1; else s.b = Math.min(6, s.b + level);
    s.d = today() + (level === 0 ? 0 : BOX_DAYS[s.b]);
    S.cards[id] = s; save();
  }

  var voice = null;
  function findVoice() { try { var vs = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; for (var i = 0; i < vs.length; i++) if (/^mg/i.test(vs[i].lang)) { voice = vs[i]; return; } } catch (e) {} }
  findVoice(); try { if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = findVoice; } catch (e) {}
  function say(text) { try { if (!voice) return; var u = new SpeechSynthesisUtterance(text); u.voice = voice; u.lang = voice.lang; window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); } catch (e) {} }

  var V = { name: "home" };
  function go(v) { V = v; render(); window.scrollTo(0, 0); }

  function head(back) {
    return '<div class="top"><div class="brand">Dingana<small>Malagasy</small></div>' +
      (back ? '<button class="link" data-act="home">Retour</button>' : '<button class="link" data-act="settings">Réglages</button>') + '</div>';
  }

  function homeView() {
    var due = dueCards().length, st = streak(), n = learnedCount();
    var h = head(false) + '<h1>Mianatra malagasy</h1><p class="muted">Du malgache d\'Antananarivo, pas à pas, autour de la famille et du quotidien. Quelques minutes par jour suffisent.</p>';
    if (due > 0) h += '<div class="banner"><strong>' + due + ' carte' + (due > 1 ? 's' : '') + ' à réviser</strong><p class="muted">Réviser peu et souvent fixe mieux les mots que de tout relire d\'un coup.</p><button class="btn" data-act="review">Réviser maintenant</button></div>';
    else if (Object.keys(S.cards).length) h += '<div class="banner"><strong>Rien à réviser pour le moment</strong><p class="muted">Tes prochaines cartes reviendront d\'elles-mêmes. Tu peux avancer dans la leçon suivante ou faire un quiz libre.</p><button class="btn alt" data-act="quiz">Faire un quiz</button></div>';
    else h += '<div class="banner"><strong>Commence par la leçon 1</strong><p class="muted">Lis les mots, puis ajoute-les à tes cartes de révision.</p></div>';
    h += '<div class="stats"><span>Série <b>' + st + '</b> j</span><span>Mots acquis <b>' + n + '/' + ALL.length + '</b></span><span>Cartes <b>' + Object.keys(S.cards).length + '</b></span></div>';
    h += '<ol class="path">';
    UNITS.forEach(function (u, i) {
      var open = isOpen(i), m = mastery(i), done = m >= 0.8 && S.intro[u.id];
      h += '<li><button class="unit ' + (done ? 'done' : open ? 'open' : 'locked') + '" data-unit="' + i + '"' + (open ? '' : ' disabled') + '>' +
        '<span class="no">' + (done ? '&#10003;' : (i + 1)) + '</span>' +
        '<span class="nm"><em>' + esc(u.t) + '</em><span>' + esc(u.mg) + ' · ' + u.items.length + ' mots' + (open ? '' : ' · après la leçon ' + i) + '</span></span>' +
        '<span class="meter" title="Maîtrise"><i style="width:' + Math.round(m * 100) + '%"></i></span></button></li>';
    });
    h += '</ol>';
    h += '<p class="tag">Les rappels apparaissent ici à chaque visite. Les cartes réussies reviennent après 1, 3, 7, 14 puis 30 jours.</p>';
    return h;
  }

  function unitView(ui) {
    var u = UNITS[ui], intro = !!S.intro[u.id];
    var h = head(true) + '<div><p class="tag">Leçon ' + (ui + 1) + ' · ' + esc(u.mg) + '</p><h2>' + esc(u.t) + '</h2></div><p class="muted">' + esc(u.intro) + '</p><ul class="words">';
    u.items.forEach(function (it) {
      h += '<li class="word"><span class="mg">' + esc(it[0]) + '</span><span class="fr">' + esc(it[1]) + '</span><span class="pr">' + esc(it[2]) + (voice ? ' <button class="say" data-say="' + esc(it[0]) + '">écouter</button>' : '') + '</span></li>';
    });
    h += '</ul>';
    h += '<div class="note"><span class="tag">À retenir</span><p>' + esc(u.tip) + '</p></div>';
    if (u.dialog) {
      h += '<h3>Petit dialogue</h3><div class="dial">';
      u.dialog.forEach(function (l) { h += '<div class="line"><b>' + esc(l[0]) + '</b><span>' + esc(l[1]) + '</span></div>'; });
      h += '</div>';
    }
    h += '<div class="row">';
    if (!intro) h += '<button class="btn" data-act="intro" data-unit="' + ui + '">Ajouter ces mots à mes cartes</button>';
    else h += '<button class="btn" data-act="review">Réviser mes cartes</button><button class="btn alt" data-act="quizunit" data-unit="' + ui + '">Quiz de la leçon</button>';
    h += '</div>';
    return h;
  }

  function startReview(list) {
    var q = shuffle(list).slice(0, 20).map(function (c) { return c.id; });
    V = { name: "review", q: q, i: 0, shown: false, total: q.length, again: 0 };
  }
  function reviewView() {
    if (!V.q.length || V.i >= V.q.length) {
      return head(true) + '<div class="center"><p class="tag">Séance terminée</p><h2>' + (V.total ? 'Bravo, ' + V.total + ' carte' + (V.total > 1 ? 's' : '') + ' revue' + (V.total > 1 ? 's' : '') : 'Aucune carte à réviser') + '</h2><p class="muted">Reviens demain pour la suite. Les mots difficiles reviendront plus tôt.</p><button class="btn" data-act="home">Retour à l\'accueil</button></div>';
    }
    var c = BYID[V.q[V.i]];
    var h = head(true) + '<div class="progress"><i style="width:' + Math.round(V.i / V.q.length * 100) + '%"></i></div><p class="tag">Carte ' + (V.i + 1) + ' sur ' + V.q.length + '</p>';
    h += '<div class="card"><div class="big">' + esc(c.mg) + '</div>';
    if (V.shown) h += '<div class="ans">' + esc(c.fr) + '</div><div class="pron">' + esc(c.pr) + '</div>' + (voice ? '<button class="say" data-say="' + esc(c.mg) + '">écouter</button>' : '');
    else h += '<p class="muted">Que veut dire ce mot ?</p>';
    h += '</div>';
    if (!V.shown) h += '<button class="btn" data-act="reveal">Voir la réponse</button>';
    else h += '<div class="rate"><button class="btn again" data-grade="0">Encore</button><button class="btn" data-grade="1">Bien</button><button class="btn easy" data-grade="2">Facile</button></div>';
    return h;
  }

  function startQuiz(pool) {
    if (pool.length < 4) { V = { name: "msg", text: "Ajoute d'abord au moins une leçon à tes cartes pour lancer un quiz." }; return; }
    var qs = shuffle(pool).slice(0, 8).map(function (c) {
      var dir = Math.random() < 0.7 ? "mg" : "fr";
      var others = shuffle(ALL.filter(function (x) { return x.id !== c.id && x[dir === "mg" ? "fr" : "mg"] !== c[dir === "mg" ? "fr" : "mg"]; })).slice(0, 3);
      var opts = shuffle([c].concat(others));
      return { id: c.id, dir: dir, opts: opts.map(function (o) { return o.id; }) };
    });
    V = { name: "quiz", qs: qs, i: 0, picked: null, score: 0 };
  }
  function quizView() {
    if (V.i >= V.qs.length) {
      return head(true) + '<div class="center"><p class="tag">Quiz terminé</p><div class="score">' + V.score + '/' + V.qs.length + '</div><p class="muted">' + (V.score >= V.qs.length - 1 ? 'Très bien, tu reconnais ces mots.' : 'Les mots ratés reviendront plus vite dans tes cartes.') + '</p><div class="row"><button class="btn" data-act="quiz">Un autre quiz</button><button class="btn alt" data-act="home">Accueil</button></div></div>';
    }
    var q = V.qs[V.i], c = BYID[q.id];
    var ask = q.dir === "mg" ? c.mg : c.fr;
    var h = head(true) + '<div class="progress"><i style="width:' + Math.round(V.i / V.qs.length * 100) + '%"></i></div><p class="tag">Question ' + (V.i + 1) + ' sur ' + V.qs.length + '</p>';
    h += '<div class="card" style="min-height:160px"><p class="muted">' + (q.dir === "mg" ? 'Que veut dire…' : 'Comment dit-on…') + '</p><div class="big">' + esc(ask) + '</div></div><div class="opts">';
    q.opts.forEach(function (id) {
      var o = BYID[id], label = q.dir === "mg" ? o.fr : o.mg, cls = "opt";
      if (V.picked) { if (id === q.id) cls += " right"; else if (id === V.picked) cls += " wrong"; }
      h += '<button class="' + cls + '" data-opt="' + id + '"' + (V.picked ? ' disabled' : '') + '>' + esc(label) + '</button>';
    });
    h += '</div>';
    if (V.picked) h += '<button class="btn" data-act="next">' + (V.i + 1 >= V.qs.length ? 'Voir le résultat' : 'Question suivante') + '</button>';
    return h;
  }

  function settingsView() {
    return head(true) + '<h2>Réglages</h2><div class="set"><label><input type="checkbox" id="unl"' + (S.unlockAll ? ' checked' : '') + '> Débloquer toutes les leçons</label>' +
      '<p class="muted">Les données sont gardées dans ce navigateur uniquement. Elles ne passent pas d\'un appareil à l\'autre.</p>' +
      (V.confirm ? '<p>Effacer toute ta progression ?</p><div class="row"><button class="btn" style="background:var(--bad);color:#fff" data-act="resetyes">Oui, tout effacer</button><button class="btn alt" data-act="resetno">Annuler</button></div>' : '<button class="btn alt" data-act="reset">Effacer ma progression</button>') + '</div>';
  }

  function render() {
    var h;
    if (V.name === "home") h = homeView();
    else if (V.name === "unit") h = unitView(V.ui);
    else if (V.name === "review") h = reviewView();
    else if (V.name === "quiz") h = quizView();
    else if (V.name === "settings") h = settingsView();
    else h = head(true) + '<div class="center"><p>' + esc(V.text) + '</p><button class="btn" data-act="home">Retour</button></div>';
    app.innerHTML = h;
  }

  app.addEventListener("click", function (e) {
    var t = e.target.closest("button, input");
    if (!t) return;
    if (t.id === "unl") { S.unlockAll = t.checked; save(); return; }
    if (t.dataset.say) { say(t.dataset.say); return; }
    if (t.dataset.opt) {
      if (V.picked) return;
      var q = V.qs[V.i]; V.picked = t.dataset.opt;
      var ok = V.picked === q.id; if (ok) V.score++;
      if (S.cards[q.id]) grade(q.id, ok ? 1 : 0);
      touchDay(); render(); return;
    }
    if (t.dataset.grade !== undefined) {
      var id = V.q[V.i], lv = +t.dataset.grade;
      grade(id, lv); touchDay();
      if (lv === 0 && V.again < 6) { V.q.push(id); V.again++; }
      V.i++; V.shown = false; render(); return;
    }
    if (t.dataset.unit && !t.dataset.act) { go({ name: "unit", ui: +t.dataset.unit }); return; }
    var a = t.dataset.act;
    if (a === "home") go({ name: "home" });
    else if (a === "settings") go({ name: "settings" });
    else if (a === "intro") { introduce(+t.dataset.unit); touchDay(); go({ name: "unit", ui: +t.dataset.unit }); }
    else if (a === "review") { startReview(dueCards()); render(); }
    else if (a === "reveal") { V.shown = true; render(); }
    else if (a === "quiz") { startQuiz(Object.keys(S.cards).map(function (k) { return BYID[k]; })); render(); }
    else if (a === "quizunit") { startQuiz(unitCards(+t.dataset.unit)); render(); }
    else if (a === "next") { V.i++; V.picked = null; render(); }
    else if (a === "reset") { V.confirm = true; render(); }
    else if (a === "resetno") { V.confirm = false; render(); }
    else if (a === "resetyes") { S = { cards: {}, intro: {}, days: [], unlockAll: false }; save(); go({ name: "home" }); }
  });

  render();
})();
</script>

</body></html>
