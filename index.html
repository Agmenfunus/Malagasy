<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dingana Malagasy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : une colonne étroite façon carnet de classe, chemin d'unités en liste verticale, cartes plein cadre pour les révisions. */
:root {
  --bg: #eef2ea;
  --surface: #f9fbf6;
  --fg: #17301f;
  --muted: #55675a;
  --line: #cfd9c9;
  --accent: #6b3fa0;       /* jacaranda, en fleur à Antananarivo en octobre */
  --accent-fg: #ffffff;
  --rice: #3f7a3a;         /* rizière */
  --earth: #b4532a;        /* latérite */
  --good: #2f7a3e;
  --bad: #b3402a;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101a13; --surface: #17251b; --fg: #e6efe2; --muted: #98ab9c; --line: #2b3d30;
    --accent: #b99be6; --accent-fg: #1a0f2b; --rice: #7fc07a; --earth: #e08a5f; --good: #7fd08e; --bad: #f0907a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101a13; --surface: #17251b; --fg: #e6efe2; --muted: #98ab9c; --line: #2b3d30;
  --accent: #b99be6; --accent-fg: #1a0f2b; --rice: #7fc07a; --earth: #e08a5f; --good: #7fd08e; --bad: #f0907a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.5; padding-inline: 16px; padding-block: 20px 48px; }
.wrap { max-width: 640px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 2rem; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; letter-spacing: .01em; }
.brand small { font-family: var(--font-mono); font-weight: 400; color: var(--muted); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; margin-left: 8px; }
.link { background: none; border: 0; padding: 6px 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.btn { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 600; min-height: 46px; }
.btn.alt { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 130px; }
.banner { background: var(--surface); border: 1.5px solid var(--accent); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.banner strong { font-family: var(--font-display); font-size: 1.25rem; }
.stats { display: flex; gap: 20px; flex-wrap: wrap; color: var(--muted); font-size: .95rem; }
.stats b { color: var(--fg); font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-weight: 500; }
.path { display: flex; flex-direction: column; list-style: none; padding: 0; margin: 0; }
.unit { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); background: none; border-inline: 0; border-bottom: 0; text-align: left; width: 100%; }
.unit:last-child { border-bottom: 1px solid var(--line); }
.unit .no { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-family: var(--font-mono); font-size: .9rem; color: var(--muted); }
.unit.open .no { border-color: var(--accent); color: var(--accent); }
.unit.done .no { background: var(--rice); border-color: var(--rice); color: var(--bg); }
.unit .nm { display: flex; flex-direction: column; min-width: 0; }
.unit .nm span { color: var(--muted); font-size: .9rem; }
.unit .nm em { font-style: normal; font-family: var(--font-display); font-size: 1.05rem; font-weight: 500; }
.unit.locked { opacity: .5; cursor: default; }
.meter { width: 64px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--rice); }
.tag { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); letter-spacing: .04em; }
.words { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.word { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.word .mg { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; overflow-wrap: anywhere; }
.word .fr { overflow-wrap: anywhere; }
.word .pr { grid-column: 1 / -1; font-family: var(--font-mono); font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.say { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; font-size: .8rem; color: var(--accent); }
.note { background: var(--surface); border-left: 4px solid var(--earth); border-radius: 0 10px 10px 0; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.note .tag { color: var(--earth); text-transform: uppercase; letter-spacing: .1em; }
.dial { display: flex; flex-direction: column; gap: 10px; }
.line { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.line b { font-family: var(--font-display); font-size: 1.05rem; }
.line span { color: var(--muted); font-size: .92rem; }
.line:nth-child(even) { margin-left: 24px; }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 28px 20px; min-height: 260px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 14px; }
.card .big { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.9rem, 8vw, 2.6rem); overflow-wrap: anywhere; }
.card .pron { font-family: var(--font-mono); color: var(--muted); font-size: .95rem; }
.card .ans { font-size: 1.4rem; overflow-wrap: anywhere; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px; min-height: 52px; overflow-wrap: anywhere; }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--surface)); }
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.rate .btn { padding-inline: 6px; }
.rate .again { background: var(--bad); color: #fff; }
.rate .easy { background: var(--rice); color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .rate .again, :root:not([data-theme="light"]) .rate .easy { color: #101a13; } }
:root[data-theme="dark"] .rate .again, :root[data-theme="dark"] .rate .easy { color: #101a13; }
.center { text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; padding-block: 24px; }
.score { font-family: var(--font-display); font-size: 3rem; font-weight: 700; color: var(--accent); }
.muted { color: var(--muted); }
.set { display: flex; flex-direction: column; gap: 12px; }
.set label { display: flex; gap: 10px; align-items: center; }
.set input { width: 20px; height: 20px; accent-color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);display:block}
.dots i.on{background:var(--rice);border-color:var(--rice)}
.lessons{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.lesson{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px}
.lesson .no{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--font-mono);font-size:.85rem;color:var(--muted)}
.lesson.next{border-color:var(--accent)}
.lesson.next .no{border-color:var(--accent);color:var(--accent)}
.lesson.passed .no{background:var(--rice);border-color:var(--rice);color:var(--bg)}
.lesson.locked{opacity:.5}
.lesson .nm{display:flex;flex-direction:column;min-width:0}
.lesson .nm em{font-style:normal;font-family:var(--font-display);font-weight:500}
.lesson .nm span{color:var(--muted);font-size:.88rem}
.goal{display:flex;flex-direction:column;gap:6px}
.goal .progress i{background:var(--rice)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px;min-width:0}
.mt{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;min-height:52px;text-align:left;overflow-wrap:anywhere}
.mt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.mt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface));opacity:.6}
.mt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.inp{width:100%;font:inherit;font-size:1.15rem;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
.fb{border-radius:12px;padding:12px 14px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px}
.fb.ok{border-color:var(--good)}
.fb.ko{border-color:var(--bad)}
.fb b{font-family:var(--font-display)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:52px}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--font-display);font-weight:500}
.answerbox{border-bottom:2px solid var(--line);padding-bottom:10px;min-height:62px}
.dict{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.dict li{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column}
.dict li b{font-family:var(--font-display)}
.dict li span{color:var(--muted);font-size:.9rem}
.form{display:flex;flex-direction:column;gap:10px}
textarea.inp{min-height:110px;font-family:var(--font-mono);font-size:.8rem}
.small{font-size:.9rem}
.tag.hi{color:var(--earth)}
</style>

<div class="wrap" id="app"></div>

<script>
// Contenu des chapitres. Chaque mot : [malgache, français, prononciation approchée]
const UNITS = [
  {
    id: "u1", t: "Saluer et remercier", mg: "Miarahaba",
    intro: "Les mots que tu entendras en premier, dès qu'on se retrouve ou qu'on se quitte.",
    items: [
      ["Salama", "salut, bonjour", "sa-lam'"],
      ["Manao ahoana", "bonjour, comment vas-tu ?", "ma-naou a-hou-an'"],
      ["Akory", "salut ! ça va ? (familier)", "a-kou-ri"],
      ["Tsara", "bien, bon", "tsar'"],
      ["Tsara fa ianao ?", "bien, et toi ?", "tsar' fa i-a-naou"],
      ["Misaotra", "merci", "mi-saoutr'"],
      ["Misaotra betsaka", "merci beaucoup", "mi-saoutr' bé-tsak'"],
      ["Azafady", "s'il vous plaît, excusez-moi", "a-za-fa-di"],
      ["Eny", "oui", "é-ni"],
      ["Tsia", "non", "tsi-a"],
      ["Veloma", "au revoir", "vé-lou-m'"],
      ["Mandra-pihaona", "à la prochaine", "mandr' pi-haou-n'"],
      ["Tonga soa", "bienvenue", "toun-ga sou-a"],
      ["Tompoko", "oui (poli), ou « pardon ? » quand on t'appelle", "toum-pou-kou"]
    ],
    tip: "Prononciation : o se lit « ou », y final se lit « i », ao se lit « aou ». Les fins en -ka, -tra, -na sont à peine prononcées : misaotra sonne « misaoutr' ». Manao ahoana convient à toute heure du jour, akory plutôt entre proches.",
    dialog: [
      ["Salama !", "Salut !"],
      ["Manao ahoana ianao ?", "Comment vas-tu ?"],
      ["Tsara aho. Fa ianao ?", "Je vais bien. Et toi ?"],
      ["Tsara. Misaotra !", "Bien. Merci !"]
    ]
  },
  {
    id: "u2", t: "La famille proche", mg: "Ny fianakaviana",
    intro: "Papa, maman, frères, sœurs : les mots de la maison.",
    items: [
      ["Fianakaviana", "famille", "fi-a-na-ka-vi-an'"],
      ["Neny", "maman", "né-ni"],
      ["Dada", "papa", "da-da"],
      ["Reny", "mère", "ré-ni"],
      ["Ray", "père", "raï"],
      ["Zanaka", "enfant", "za-nak'"],
      ["Zazalahy", "garçon", "za-za-la-hi"],
      ["Zazavavy", "fille", "za-za-va-vi"],
      ["Rahalahy", "frère (d'un homme)", "ra-ha-la-hi"],
      ["Anabavy", "sœur (d'un homme)", "a-na-ba-vi"],
      ["Zoky", "aîné(e)", "zou-ki"],
      ["Zandriny", "cadet(te)", "zan-dri-ni"]
    ],
    tip: "Neny et dada sont les mots du quotidien pour maman et papa. Reny et ray sont plus neutres. Pour frère et sœur, le mot dépend de qui parle : un homme dit rahalahy et anabavy, une femme dit anadahy (frère) et rahavavy (sœur). Zoky et zandriny servent pour l'âge dans une fratrie."
  },
  {
    id: "u3", t: "Toute la famille", mg: "Ny havana",
    intro: "Grands-parents, oncles, tantes, et la manière de dire « ma mère », « ton enfant ».",
    items: [
      ["Dadabe", "grand-père", "da-da-bé"],
      ["Nenibe", "grand-mère", "né-ni-bé"],
      ["Dadatoa", "oncle", "da-da-tou-a"],
      ["Nenitoa", "tante", "né-ni-tou-a"],
      ["Vady", "époux, épouse", "va-di"],
      ["Havana", "parent, membre de la famille", "ha-van'"],
      ["Zafy", "petit-enfant", "za-fi"],
      ["Reniko", "ma mère", "ré-ni-kou"],
      ["Raiko", "mon père", "raï-kou"],
      ["Zanako", "mon enfant", "za-na-kou"],
      ["Vadiko", "mon époux, mon épouse", "va-di-kou"],
      ["Havako", "mon parent", "ha-va-kou"],
      ["Tiako ianao", "je t'aime (bien)", "ti-a-kou i-a-naou"]
    ],
    tip: "Pour dire « mon / ma », on ajoute -ko à la fin du mot : vady → vadiko. Pour « ton / ta », c'est -nao (zanakao, ton enfant). Pour « son / sa », c'est -ny (reniny, sa mère). Si le mot finit par -ka ou -na, cette fin tombe : zanaka → zanako, havana → havako."
  },
  {
    id: "u4", t: "Se présenter", mg: "Mampahafantatra tena",
    intro: "Dire qui tu es, et expliquer que tu apprends la langue.",
    items: [
      ["Aho", "je, moi", "a-hou"],
      ["Ianao", "tu, toi", "i-a-naou"],
      ["Izy", "il, elle", "i-zi"],
      ["Isika", "nous (toi inclus)", "i-sik'"],
      ["Izahay", "nous (toi exclu)", "i-za-haï"],
      ["Ianareo", "vous (pluriel)", "i-a-na-ré-ou"],
      ["Iza no anaranao ?", "comment t'appelles-tu ?", "i-za nou a-na-ra-naou"],
      ["Ny anarako dia ...", "je m'appelle ...", "ni a-na-ra-kou dia"],
      ["Mianatra aho", "j'apprends", "mi-a-natr' a-hou"],
      ["Tsy mahay miteny malagasy aho", "je ne sais pas parler malgache", "tsi ma-haï mi-té-ni ma-la-ga-si a-hou"],
      ["Malagasy", "malgache (personne ou langue)", "ma-la-ga-si"],
      ["Gasy", "malgache (familier)", "ga-si"],
      ["Vazaha", "étranger (souvent une personne blanche)", "va-za"]
    ],
    tip: "Le malgache a deux « nous » : isika inclut la personne à qui tu parles, izahay l'exclut. Tu entendras souvent vazaha dans la rue : c'est un mot courant pour désigner l'étranger, pas une insulte en soi.",
    dialog: [
      ["Iza no anaranao ?", "Comment t'appelles-tu ?"],
      ["Ny anarako dia Rakoto.", "Je m'appelle Rakoto."],
      ["Mahay miteny gasy ve ianao ?", "Tu sais parler malgache ?"],
      ["Tsia, mianatra aho.", "Non, j'apprends."]
    ]
  },
  {
    id: "u5", t: "Poser des questions", mg: "Manontany",
    intro: "Les petits mots interrogatifs qui reviennent dans presque toutes les conversations.",
    items: [
      ["Inona ?", "quoi ? qu'est-ce que ?", "i-nou-na"],
      ["Iza ?", "qui ?", "i-za"],
      ["Aiza ?", "où ?", "aï-za"],
      ["Oviana ?", "quand ?", "ou-vi-an'"],
      ["Nahoana ?", "pourquoi ?", "na-hou-an'"],
      ["Ahoana ?", "comment ?", "a-hou-an'"],
      ["Ohatrinona ?", "combien ça coûte ?", "ou-a-tri-nou-n'"],
      ["Ve", "particule de question (oui ou non)", "vé"],
      ["Inona ity ?", "qu'est-ce que c'est ?", "i-nou-n' i-ti"],
      ["Misy ... ?", "y a-t-il ... ?", "mi-si"],
      ["Tsy misy", "il n'y en a pas", "tsi mi-si"]
    ],
    tip: "Pour une question oui ou non, on garde la phrase et on ajoute ve : Mandeha ve ianao ? (Tu y vas ?). Tsy devant un verbe ou devant misy donne la négation. Ity veut dire « ceci », io veut dire « cela »."
  },
  {
    id: "u6", t: "Se faire comprendre", mg: "Azo ve ?",
    intro: "Les phrases qui sauvent quand tu ne suis pas la conversation.",
    items: [
      ["Azoko", "je comprends", "a-zou-kou"],
      ["Tsy azoko", "je ne comprends pas", "tsi a-zou-kou"],
      ["Miadana azafady", "doucement, s'il vous plaît", "mi-a-da-n' a-za-fa-di"],
      ["Avereno azafady", "répétez, s'il vous plaît", "a-vé-ré-nou a-za-fa-di"],
      ["Mihainoa", "écoute !", "mi-haï-nou-a"],
      ["Mazava", "c'est clair, d'accord", "ma-za-va"],
      ["Tsy fantatro", "je ne sais pas", "tsi fan-ta-trou"],
      ["Tsy misy olana", "pas de problème", "tsi mi-si ou-la-na"],
      ["Maninona ianao ?", "qu'est-ce qui t'arrive ?", "ma-ni-nou-n' i-a-naou"],
      ["Tsy maninona", "ce n'est rien", "tsi ma-ni-nou-na"],
      ["Mazotoa", "courage !", "ma-zou-tou-a"],
      ["Tsara be", "très bien", "tsar' bé"]
    ],
    tip: "Azoko vient d'un verbe qui veut dire « obtenir » : littéralement « c'est obtenu par moi ». Be veut dire « beaucoup » ou « très » : tsara be, très bien. Mazotoa s'entend partout pour encourager quelqu'un qui travaille ou qui fait un effort."
  },
  {
    id: "u7", t: "À table", mg: "Sakafo",
    intro: "Le riz est au centre du repas. Le reste s'appelle le laoka.",
    items: [
      ["Sakafo", "repas, nourriture", "sa-ka-fou"],
      ["Vary", "riz (cuit)", "va-ri"],
      ["Laoka", "plat qui accompagne le riz", "laou-ka"],
      ["Rano", "eau", "ra-nou"],
      ["Hena", "viande", "hé-na"],
      ["Trondro", "poisson", "troun-drou"],
      ["Sakay", "piment", "sa-kaï"],
      ["Mihinana", "manger", "mi-hi-nan'"],
      ["Misotro", "boire", "mi-sou-trou"],
      ["Noana aho", "j'ai faim", "nou-a-na a-hou"],
      ["Mangetaheta aho", "j'ai soif", "man-gué-té-ta a-hou"],
      ["Voky aho", "je suis rassasié", "vou-ki a-hou"],
      ["Matsiro", "délicieux", "ma-tsi-rou"],
      ["Mandrosoa", "entre, sers-toi, je t'en prie", "man-drou-sou-a"]
    ],
    tip: "L'ordre des mots est verbe, puis objet, puis sujet : Mihinana vary aho, littéralement « mange riz moi », donc « je mange du riz ». Après le repas, on dit souvent voky aho pour dire qu'on n'a plus faim, sans vouloir refuser par politesse.",

        '<span class="nm"><em>' + esc(u.t) + '</em><span>' + esc(u.mg) + ' · ' + (open ? (done ? 'sujet validé' : pc + ' leçon' + (pc > 1 ? 's' : '') + ' sur 4') : 'réussis 2 leçons du sujet ' + i) + '</span></span>' + dots(i) + '</button></li>';
    });
    h += '</ol>';
    var weak = practiceCards(true);
    if (weak.length >= 3) {
      h += '<div class="note"><span class="tag">À retravailler</span><p>' + weak.slice(0, 5).map(function (c) { return '<b>' + esc(c.mg) + '</b>'; }).join(', ') + '</p><button class="btn alt" data-act="weak">S\'entraîner sur ces mots</button></div>';
    }

    h += '<p class="tag">Les rappels apparaissent ici à chaque visite. Les cartes réussies reviennent après 1, 3, 7, 14 puis 30 jours.</p>';

  }

  // ---------- fiche d'un sujet ----------
  function unitView(ui) {
    var u = UNITS[ui], ph = PHRASES[u.id] || [];

    h += '<h3>Les 4 leçons du sujet</h3><ul class="lessons">';
    var firstNext = -1;
    for (var k = 0; k < 4; k++) if (!lessonPassed(ui, k)) { firstNext = k; break; }
    LESSONS.forEach(function (L, k) {
      var open = lessonOpen(ui, k), pass = lessonPassed(ui, k), best = lessonStat(ui)[k];
      h += '<li><button class="lesson ' + (pass ? 'passed' : !open ? 'locked' : k === firstNext ? 'next' : '') + '" data-lesson="' + k + '" data-unit="' + ui + '"' + (open ? '' : ' disabled') + '>' +
        '<span class="no">' + (pass ? '&#10003;' : (k + 1)) + '</span><span class="nm"><em>' + esc(L.t) + '</em><span>' + esc(L.d) + '</span></span><span class="tag">' + (best != null ? Math.round(best * 100) + ' %' : open ? 'à faire' : 'verrouillée') + '</span></button></li>';
    });
    h += '</ul>';
    if (passedCount(ui) === 4) h += '<p class="tag hi">Sujet validé. Refaire les leçons te garde en forme.</p>';
    h += '<h3>Les mots</h3><ul class="words">';
    u.items.forEach(function (it) {
      h += '<li class="word"><span class="mg">' + esc(it[0]) + '</span><span class="fr">' + esc(it[1]) + '</span><span class="pr">' + esc(it[2]) + (voice ? ' <button class="say" data-say="' + esc(it[0]) + '">écouter</button>' : '') + '</span></li>';
    });
    h += '</ul><div class="note"><span class="tag">À retenir</span><p>' + esc(u.tip) + '</p></div>';
    if (ph.length) {
      h += '<h3>Petites phrases</h3><ul class="words">';
      ph.forEach(function (p) {
        h += '<li class="word"><span class="mg">' + esc(p[0]) + '</span><span class="fr">' + esc(p[1]) + '</span>' + (p[2] ? '<span class="pr">' + esc(p[2]) + '</span>' : '') + '</li>';
      });
      h += '</ul>';
    }
    if (u.dialog) {
      h += '<h3>Petit dialogue</h3><div class="dial">';
      u.dialog.forEach(function (l) { h += '<div class="line"><b>' + esc(l[0]) + '</b><span>' + esc(l[1]) + '</span></div>'; });
      h += '</div>';
    }
    return h;
  }

  // ---------- exercices ----------
  function newState(e) {
    if (!e) return {};
    if (e.k === "match") return { sel: null, done: [], bad: null, wrong: {}, mistakes: 0, over: false };
    if (e.k === "tiles") return { placed: [], fb: null };
    if (e.k === "type") return { fb: null };
    return { picked: null };
  }
  function startEx(meta, ex) {
    V = { name: "ex", title: meta.title, mode: meta.mode, ui: meta.ui, k: meta.k, thr: meta.thr, ex: ex, i: 0, first: 0, total: ex.length, st: newState(ex[0]), done: false };
    render(); window.scrollTo(0, 0);
  }
  function startLesson(ui, k) {
    introduce(ui, "w"); if (k >= 2) introduce(ui, "p");
    startEx({ title: UNITS[ui].t + " · leçon " + (k + 1), mode: "lesson", ui: ui, k: k, thr: LESSONS[k].thr }, buildLesson(ui, k));
  }
  function startPractice(weak) {
    var cs = practiceCards(weak);
    if (cs.length < 4) { go({ name: "msg", text: "Fais d'abord une leçon : il faut au moins 4 mots dans tes cartes pour lancer une pratique." }); return; }
    startEx({ title: weak ? "Mots à retravailler" : "Pratique mixte", mode: weak ? "weak" : "practice", thr: null }, buildFrom(cs));
  }
  function finishEx(ok) {
    var e = V.ex[V.i];
    if (e.retry) return;
    bumpDaily(); if (ok) V.first++;
    if (e.k === "match") e.ids.forEach(function (id) { grade(id, V.st.wrong[id] ? 0 : 1); });
    else {
      grade(e.id, ok ? 1 : 0);
      if (!ok) {
        var c = getCard(e.id), r = e.k === "choice" ? mkChoice(c, e.dir) : e.k === "type" ? mkType(c) : mkTiles(c);
        r.retry = true; V.ex.push(r);
      }
    }
    save();
  }
  function nextEx() {
    V.i++;
    if (V.i >= V.ex.length) { completeSession(); }
    else V.st = newState(V.ex[V.i]);
    render(); window.scrollTo(0, 0);
  }
  function completeSession() {
    V.done = true;
    var pct = V.total ? V.first / V.total : 0;
    V.pct = pct;
    if (V.mode === "lesson") {
      var id = UNITS[V.ui].id, l = S.lessons[id] || (S.lessons[id] = {});
      var before = passedCount(V.ui);
      l[V.k] = Math.max(l[V.k] || 0, pct);
      V.newlyValid = before < 4 && passedCount(V.ui) === 4;
    }
    touchDay();
  }
  function exView() {
    if (V.done) return endView();
    var e = V.ex[V.i], st = V.st, c = e.k === "match" ? null : getCard(e.id), h;
    var back = V.mode === "lesson" ? "unit" : "home";
    h = head("quit", "Quitter") + '<div class="progress"><i style="width:' + Math.round(V.i / V.ex.length * 100) + '%"></i></div><p class="tag">' + esc(V.title) + (e.retry ? ' · pour réessayer' : '') + '</p>';
    if (e.k === "choice") {
      var q = e.dir === "mg" ? c.mg : c.fr;
      h += '<div class="card" style="min-height:150px"><p class="muted">' + (e.dir === "mg" ? 'Que veut dire…' : 'Comment dit-on…') + '</p>' + big(c, q) + (e.dir === "mg" && voice ? '<button class="say" data-say="' + esc(c.mg) + '">écouter</button>' : '') + '</div><div class="opts">';
      e.opts.forEach(function (id) {
        var o = getCard(id), cls = "opt";
        if (st.picked) { if (id === e.id) cls += " right"; else if (id === st.picked) cls += " wrong"; }
        h += '<button class="' + cls + '" data-opt="' + id + '"' + (st.picked ? ' disabled' : '') + '>' + esc(e.dir === "mg" ? o.fr : o.mg) + '</button>';
      });
      h += '</div>';
      if (st.picked) h += '<button class="btn" data-act="next">Continuer</button>';
    } else if (e.k === "match") {
      h += '<h3>Associe chaque mot à sa traduction</h3><div class="match"><div class="col">';
      e.left.forEach(function (id) {
        var cls = "mt"; if (st.done.indexOf(id) >= 0) cls += " ok"; else if (st.sel === id) cls += " sel"; else if (st.bad && st.bad[0] === id) cls += " no";
        h += '<button class="' + cls + '" data-ml="' + id + '"' + (st.done.indexOf(id) >= 0 ? ' disabled' : '') + '>' + esc(getCard(id).mg) + '</button>';
      });
      h += '</div><div class="col">';
      e.right.forEach(function (id) {
        var cls = "mt"; if (st.done.indexOf(id) >= 0) cls += " ok"; else if (st.bad && st.bad[1] === id) cls += " no";
        h += '<button class="' + cls + '" data-mr="' + id + '"' + (st.done.indexOf(id) >= 0 ? ' disabled' : '') + '>' + esc(getCard(id).fr) + '</button>';
      });
      h += '</div></div>';
      if (st.over) h += '<div class="fb ' + (st.mistakes ? 'ko' : 'ok') + '"><b>' + (st.mistakes ? st.mistakes + ' erreur' + (st.mistakes > 1 ? 's' : '') : 'Sans faute') + '</b></div><button class="btn" data-act="next">Continuer</button>';
    } else if (e.k === "type") {
      h += '<div class="card" style="min-height:150px"><p class="muted">Écris en malgache :</p>' + big(c, c.fr) + '</div>';
      if (!st.fb) h += '<input class="inp" id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Ta réponse en malgache"><div class="row"><button class="btn" data-act="check">Vérifier</button><button class="btn alt" data-act="skip">Je ne sais pas</button></div><p class="tag">Les accents et les majuscules ne comptent pas.</p>';
      else {
        h += '<div class="fb ' + (st.fb.ok ? 'ok' : 'ko') + '"><b>' + (st.fb.ok ? (st.fb.near ? 'Presque, vérifie l\'orthographe' : 'Correct') : 'Pas tout à fait') + '</b><span>' + esc(st.fb.ans) + '</span></div><button class="btn" data-act="next">Continuer</button>';
      }
    } else {
      var want = tokens(c.mg);
      h += '<div class="card" style="min-height:130px"><p class="muted">Compose la phrase en malgache :</p>' + big(c, c.fr) + '</div>';
      h += '<div class="tiles answerbox">' + st.placed.map(function (n, i) { var t = e.bank.filter(function (b) { return b.n === n; })[0]; return '<button class="tile" data-placed="' + i + '"' + (st.fb ? ' disabled' : '') + '>' + esc(t.t) + '</button>'; }).join("") + '</div>';
      h += '<div class="tiles">' + e.bank.filter(function (b) { return st.placed.indexOf(b.n) < 0; }).map(function (b) { return '<button class="tile" data-tile="' + b.n + '"' + (st.fb ? ' disabled' : '') + '>' + esc(b.t) + '</button>'; }).join("") + '</div>';
      if (!st.fb) h += '<button class="btn" data-act="check"' + (st.placed.length ? '' : ' disabled') + '>Vérifier</button>';
      else h += '<div class="fb ' + (st.fb.ok ? 'ok' : 'ko') + '"><b>' + (st.fb.ok ? 'Correct' : 'Pas tout à fait') + '</b><span>' + esc(c.mg) + '</span></div><button class="btn" data-act="next">Continuer</button>';
    }
    return h;
  }
  function endView() {
    var pct = Math.round(V.pct * 100), ok = V.thr == null || V.pct >= V.thr;
    var h = head(null, "").replace('<button class="link" data-act="settings">Réglages</button>', '');
    h += '<div class="center"><p class="tag">' + esc(V.title) + '</p><div class="score">' + pct + ' %</div>';
    if (V.mode === "lesson") {
      if (V.newlyValid) h += '<h2>Sujet validé</h2><p class="muted">Tu as réussi les 4 leçons de « ' + esc(UNITS[V.ui].t) + ' ». Les cartes te le feront revoir régulièrement.</p>';
      else if (ok) h += '<h2>Leçon réussie</h2><p class="muted">' + (V.k < 3 ? 'La leçon suivante est débloquée.' : 'Épreuve réussie.') + '</p>';
      else h += '<h2>Il faut ' + Math.round(V.thr * 100) + ' % pour valider</h2><p class="muted">Relis la fiche du sujet, puis recommence. Les mots ratés reviendront plus vite dans tes cartes.</p>';
      h += '<div class="row">';
      if (ok && V.k < 3) h += '<button class="btn" data-lesson="' + (V.k + 1) + '" data-unit="' + V.ui + '">Leçon suivante</button>';
      h += '<button class="btn alt" data-lesson="' + V.k + '" data-unit="' + V.ui + '">Refaire</button><button class="btn alt" data-unit="' + V.ui + '">Fiche du sujet</button></div>';
    } else {
      h += '<h2>' + (pct >= 80 ? 'Très bien' : 'Continue comme ça') + '</h2><p class="muted">Les mots ratés reviendront plus vite dans tes cartes.</p><div class="row"><button class="btn" data-act="' + (V.mode === "weak" ? "weak" : "practice") + '">Encore une série</button><button class="btn alt" data-act="home">Accueil</button></div>';
    }
    return h + '</div>';
  }

  // ---------- cartes à réviser ----------
  function startReview(list) {
    var q = shuffle(list).slice(0, 20).map(function (c) { return c.id; });
    V = { name: "review", q: q, i: 0, shown: false, total: q.length, again: 0 };
  }
  function reviewView() {
    if (!V.q.length || V.i >= V.q.length) {
      return head("home") + '<div class="center"><p class="tag">Séance terminée</p><h2>' + (V.total ? 'Bravo, ' + V.total + ' carte' + (V.total > 1 ? 's' : '') + ' revue' + (V.total > 1 ? 's' : '') : 'Aucune carte à réviser') + '</h2><p class="muted">Reviens demain pour la suite. Les mots difficiles reviendront plus tôt.</p><button class="btn" data-act="home">Retour à l\'accueil</button></div>';
    }
    var c = getCard(V.q[V.i]);
    var h = head("home") + '<div class="progress"><i style="width:' + Math.round(V.i / V.q.length * 100) + '%"></i></div><p class="tag">Carte ' + (V.i + 1) + ' sur ' + V.q.length + '</p>';
    h += '<div class="card">' + big(c, c.mg);
    if (V.shown) h += '<div class="ans">' + esc(c.fr) + '</div>' + (c.pr ? '<div class="pron">' + esc(c.pr) + '</div>' : '') + (voice ? '<button class="say" data-say="' + esc(c.mg) + '">écouter</button>' : '');
    else h += '<p class="muted">Que veut dire ce ' + (c.kind === "p" ? 'texte' : 'mot') + ' ?</p>';
    h += '</div>';
    if (!V.shown) h += '<button class="btn" data-act="reveal">Voir la réponse</button>';
    else h += '<div class="rate"><button class="btn again" data-grade="0">Encore</button><button class="btn" data-grade="1">Bien</button><button class="btn easy" data-grade="2">Facile</button></div>';
    return h;
  }

  // ---------- dictionnaire, mes mots, réglages ----------
  function dictList(q) {
    var n = norm(q), out = allCards().filter(function (c) { return !n || norm(c.mg).indexOf(n) >= 0 || norm(c.fr).indexOf(n) >= 0; });
    var h = out.slice(0, 80).map(function (c) {
      return '<li><b>' + esc(c.mg) + '</b><span>' + esc(c.fr) + (c.pr && c.kind === "w" ? ' · ' + esc(c.pr) : '') + ' · ' + (c.u < 0 ? 'mes mots' : esc(UNITS[c.u].t)) + '</span></li>';
    }).join("");
    return h || '<li><span>Aucun résultat. Tu peux ajouter ce mot dans « Mes mots ».</span></li>';
  }
  function dictView() {
    return head("home") + '<h2>Dictionnaire</h2><input class="inp" id="q" type="search" placeholder="Chercher en malgache ou en français" aria-label="Chercher un mot" autocomplete="off"><ul class="dict" id="dl">' + dictList("") + '</ul>';
  }
  function mineView() {
    var h = head("home") + '<h2>Mes mots</h2><p class="muted">Note ici les mots que tu entends en famille. Ils rejoignent tes cartes de révision et tes pratiques mixtes.</p>';
    h += '<div class="form"><input class="inp" id="cmg" type="text" placeholder="Mot ou phrase en malgache" aria-label="En malgache" autocomplete="off"><input class="inp" id="cfr" type="text" placeholder="Sens en français" aria-label="En français" autocomplete="off"><input class="inp" id="cnote" type="text" placeholder="Note facultative (qui l\'a dit, prononciation)" aria-label="Note" autocomplete="off"><button class="btn" data-act="addmine">Ajouter</button>' + (V.msg ? '<p class="tag hi">' + esc(V.msg) + '</p>' : '') + '</div>';
    if (S.custom.length) {
      h += '<ul class="dict">' + S.custom.map(function (c) { return '<li><b>' + esc(c.mg) + '</b><span>' + esc(c.fr) + (c.note ? ' · ' + esc(c.note) : '') + '</span><button class="link" data-del="' + c.n + '" style="align-self:flex-start">Supprimer</button></li>'; }).join("") + '</ul>';
    } else h += '<p class="muted">Rien pour l\'instant. Ajoute ton premier mot.</p>';
    return h;
  }
  function settingsView() {
    var h = head("home") + '<h2>Réglages</h2><div class="set"><label><input type="checkbox" id="unl"' + (S.unlockAll ? ' checked' : '') + '> Débloquer tous les sujets et toutes les leçons</label>';
    h += '<label for="goal">Objectif du jour</label><select class="inp" id="goal">' + [5, 10, 20, 30].map(function (g) { return '<option value="' + g + '"' + (S.goal === g ? ' selected' : '') + '>' + g + ' exercices</option>'; }).join("") + '</select>';
    h += '<h3>Sauvegarde</h3><p class="muted small">Ta progression reste dans ce navigateur. Pour la passer d\'un appareil à l\'autre, génère le code, copie-le, puis colle-le dans l\'autre appareil et importe-le.</p><textarea class="inp" id="bk" aria-label="Code de sauvegarde" spellcheck="false"></textarea><div class="row"><button class="btn alt" data-act="export">Générer le code</button><button class="btn alt" data-act="import">Importer ce code</button></div>' + (V.msg ? '<p class="tag hi">' + esc(V.msg) + '</p>' : '');
    h += (V.confirm ? '<p>Effacer toute ta progression ?</p><div class="row"><button class="btn" style="background:var(--bad);color:#fff" data-act="resetyes">Oui, tout effacer</button><button class="btn alt" data-act="resetno">Annuler</button></div>' : '<button class="btn alt" data-act="reset">Effacer ma progression</button>') + '</div>';
    return h;
  }

  function render() {
    var h;
    if (V.name === "home") h = homeView();
    else if (V.name === "unit") h = unitView(V.ui);
    else if (V.name === "ex") h = exView();
    else if (V.name === "review") h = reviewView();
    else if (V.name === "dict") h = dictView();
    else if (V.name === "mine") h = mineView();
    else if (V.name === "settings") h = settingsView();
    else h = head("home") + '<div class="center"><p>' + esc(V.text) + '</p><button class="btn" data-act="home">Retour</button></div>';
    app.innerHTML = h;
    if (V.name === "ex") { var inp = document.getElementById("ans"); if (inp) inp.focus(); }
  }

  // ---------- actions ----------
  function doCheck() {
    var e = V.ex[V.i], st = V.st, c = getCard(e.id);
    if (e.k === "type") {
      var el = document.getElementById("ans"), g = norm(el ? el.value : "");
      if (!g) return;
      var cands = allCards().filter(function (x) { return x.fr === c.fr; }).map(function (x) { return norm(x.mg); });
      var exact = cands.indexOf(g) >= 0, near = !exact && cands.some(function (x) { return x.length >= 5 && lev(x, g) <= 1; });
      st.fb = { ok: exact || near, near: near, ans: c.mg };
      finishEx(exact || near);
    } else if (e.k === "tiles") {
      var want = tokens(c.mg).join(" ").toLowerCase(), got = st.placed.map(function (n) { return e.bank.filter(function (b) { return b.n === n; })[0].t; }).join(" ").toLowerCase();
      st.fb = { ok: want === got };
      finishEx(want === got);
    }
    render();
  }
  function doMatch(side, id) {
    var e = V.ex[V.i], st = V.st;
    if (st.over || st.bad) return;
    if (side === "l") { st.sel = st.sel === id ? null : id; render(); return; }
    if (!st.sel) return;
    if (st.sel === id) {
      st.done.push(id); st.sel = null;
      if (st.done.length === e.ids.length) { st.over = true; finishEx(st.mistakes === 0); }
      render();
    } else {
      st.mistakes++; st.wrong[st.sel] = true; st.wrong[id] = true; st.bad = [st.sel, id]; st.sel = null; render();
      var cur = st;
      setTimeout(function () { if (V.st === cur) { cur.bad = null; render(); } }, 600);
    }
  }
  function backup() { try { return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); } catch (e) { return ""; } }

  app.addEventListener("input", function (ev) {
    if (ev.target.id === "q") { var dl = document.getElementById("dl"); if (dl) dl.innerHTML = dictList(ev.target.value); }
  });
  app.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && ev.target.id === "ans") { ev.preventDefault(); doCheck(); }
  });
  app.addEventListener("change", function (ev) {
    if (ev.target.id === "unl") { S.unlockAll = ev.target.checked; save(); }
    if (ev.target.id === "goal") { S.goal = +ev.target.value || 10; save(); }
  });
  app.addEventListener("click", function (ev) {
    var t = ev.target.closest("button");
    if (!t) return;
    var d = t.dataset;
    if (d.say) { say(d.say); return; }
    if (d.opt) {
      if (V.st.picked) return;
      var e = V.ex[V.i]; V.st.picked = d.opt; finishEx(d.opt === e.id); render(); return;
    }
    if (d.ml) { doMatch("l", d.ml); return; }
    if (d.mr) { doMatch("r", d.mr); return; }
    if (d.tile !== undefined) { if (!V.st.fb) { V.st.placed.push(+d.tile); render(); } return; }
    if (d.placed !== undefined) { if (!V.st.fb) { V.st.placed.splice(+d.placed, 1); render(); } return; }
    if (d.grade !== undefined) {
      var id = V.q[V.i], lv = +d.grade; grade(id, lv); touchDay();
      if (lv === 0 && V.again < 6) { V.q.push(id); V.again++; }
      V.i++; V.shown = false; render(); return;
    }
    if (d.lesson !== undefined) { startLesson(+d.unit, +d.lesson); return; }
    if (d.del) { S.custom = S.custom.filter(function (c) { return String(c.n) !== d.del; }); delete S.cards["c:" + d.del]; save(); render(); return; }
    if (d.unit !== undefined && !d.act) { go({ name: "unit", ui: +d.unit }); return; }
    var a = d.act;
    if (a === "home") go({ name: "home" });
    else if (a === "settings") go({ name: "settings" });
    else if (a === "dict") go({ name: "dict" });
    else if (a === "mine") go({ name: "mine" });
    else if (a === "quit") { if (V.mode === "lesson") go({ name: "unit", ui: V.ui }); else go({ name: "home" }); }
    else if (a === "review") { startReview(dueCards()); render(); }
    else if (a === "reveal") { V.shown = true; render(); }
    else if (a === "practice") startPractice(false);
    else if (a === "weak") startPractice(true);
    else if (a === "check") doCheck();
    else if (a === "skip") { V.st.fb = { ok: false, ans: getCard(V.ex[V.i].id).mg }; finishEx(false); render(); }
    else if (a === "next") nextEx();
    else if (a === "addmine") {
      var mg = document.getElementById("cmg").value.trim(), fr = document.getElementById("cfr").value.trim(), note = document.getElementById("cnote").value.trim();
      if (!mg || !fr) { V.msg = "Il faut le mot malgache et son sens en français."; render(); return; }
      var n = S.nextC++; S.custom.push({ n: n, mg: mg, fr: fr, note: note }); S.cards["c:" + n] = { b: 1, d: today(), x: 0 }; save(); V.msg = "Ajouté à tes cartes."; render();
    }
    else if (a === "export") {
      var code = backup(), ta = document.getElementById("bk"); ta.value = code; ta.select();
      try { navigator.clipboard.writeText(code).then(function () { V.msg = "Code copié."; }, function () { V.msg = "Copie le code à la main."; }); } catch (er) { V.msg = "Copie le code à la main."; }
    }
    else if (a === "import") {
      var v = document.getElementById("bk").value.trim();
      try { adopt(JSON.parse(decodeURIComponent(escape(atob(v))))); save(); V.msg = "Progression importée."; } catch (er) { V.msg = "Ce code n'est pas valide."; }
      render();
    }
    else if (a === "reset") { V.confirm = true; render(); }
    else if (a === "resetno") { V.confirm = false; render(); }
    else if (a === "resetyes") { S = { cards: {}, intro: {}, days: [], unlockAll: false, lessons: {}, custom: [], goal: 10, daily: { d: 0, n: 0 }, nextC: 1 }; save(); go({ name: "home" }); }
  });

  render();
})();

</script>

</body></html>
